name: Core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: |
          set -euo pipefail
          for module in shared server client/linux; do
            go -C "$module" test -race ./...
            go -C "$module" vet ./...
          done
          go -C client/android test -tags atlanttest ./...
          python3 -m unittest discover -s scripts -p test_release_audit.py
          mkdir -p artifacts/current
          go -C server build -trimpath -o ../artifacts/current/atlant-server .
          go -C client/linux build -trimpath -o ../../artifacts/current/atlant-linux .
